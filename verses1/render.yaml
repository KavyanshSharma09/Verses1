databases:
  - name: verses1-db
    databaseName: verses1
    user: verses1
    plan: free

services:
  - type: web
    name: verses1
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn verses1.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: verses1-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
